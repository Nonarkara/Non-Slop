<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flood command centre</title>
<style>
@font-face{font-family:Inter;src:url("../fonts/inter-400.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:Inter;src:url("../fonts/inter-700.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#f8fafc;font-family:Inter,sans-serif}
nav{display:flex;justify-content:space-between;align-items:center;height:52px;padding:0 18px;backdrop-filter:blur(14px);background:rgba(15,23,42,.55);position:sticky;top:0}
.pill{border-radius:999px;padding:6px 12px;background:#312e81;color:#f8fafc;box-shadow:0 0 28px #818cf8}
.hero{text-align:center;padding:32px 16px 12px;background:linear-gradient(135deg,#312e81 0%,#6d28d9 48%,#0b1020 100%)}
h1{margin:8px 0;font-size:42px;line-height:1.05;background:linear-gradient(90deg,#ffffff,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0 0 8px;color:#f5f3ff}
button{font:inherit;border-radius:12px;padding:12px 18px;margin:6px;min-height:44px}
.primary{background:#4f46e5;color:#ffffff;border:0;box-shadow:0 0 30px #6366f1}
.ghost{background:#312e81;color:#f8fafc;border:1px solid #a78bfa}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:16px 18px 28px}
.card{background:#1e1b4b;color:#f8fafc;border:1px solid #a78bfa;border-radius:18px;box-shadow:0 0 30px rgba(129,140,248,.65);padding:22px;min-height:150px}
.card strong{display:block;font-size:40px;margin:8px 0 4px}
h3{margin:0;font-size:16px}
.proof{text-align:center;color:#e0e7ff;margin:0;padding:0 0 24px}
button:focus-visible{outline:2px solid #ffffff;outline-offset:3px}
@media (max-width:640px){.grid{grid-template-columns:1fr}h1{font-size:32px}}
</style>
</head>
<body>
<nav>
  <strong>Flood desk</strong>
  <span class="pill">✨ Now with AI</span>
</nav>
<section class="hero text-center">
  <h1>Supercharge your flood watch</h1>
  <p class="sub">Seamlessly unlock the morning's three figures.</p>
  <button class="primary">Get Started</button>
  <button class="ghost">Learn More</button>
</section>
<section class="grid grid-cols-3">
  <div class="card rounded-2xl shadow-lg p-6 bg-white"><h3>🚀 Over bank</h3><strong>22</strong><p>Blazing fast alerts.</p></div>
  <div class="card rounded-2xl shadow-lg p-6 bg-white"><h3>🔒 High water</h3><strong>53</strong><p>Enterprise grade watch.</p></div>
  <div class="card rounded-2xl shadow-lg p-6 bg-white"><h3>⚡ Satun rain</h3><strong>134</strong><p>Effortless insight, in mm.</p></div>
</section>
<p class="proof">Trusted by 10,000+ teams</p>
</body>
</html>
