<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padded cards</title>
<style>
@font-face{font-family:Inter;src:url("../fonts/inter-400.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:Inter;src:url("../fonts/inter-700.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#0f172a;font-family:Inter,sans-serif}
header{padding:22px 24px 0}
h1{margin:0;font-size:28px}
.sub{color:#334155}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:20px 24px 32px}
.card{background:#ffffff;border-radius:20px;box-shadow:0 16px 36px rgba(15,23,42,.14);min-height:240px;padding:28px}
.card strong{display:block;font-size:64px;line-height:1;margin:28px 0 12px}
h2{margin:0;font-size:16px;font-weight:600}
a:focus-visible{outline:2px solid #0f172a;outline-offset:3px}
@media (max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Morning figures</h1>
  <p class="sub">Each number gets its own padded card.</p>
</header>
<section class="grid grid-cols-3">
  <div class="card rounded-2xl shadow-lg p-6 bg-white"><h2>🚀 Over bank</h2><strong>22</strong><p>Seamlessly unlock the count.</p></div>
  <div class="card rounded-2xl shadow-lg p-6 bg-white"><h2>🔒 High water</h2><strong>53</strong><p>Effortless monitoring.</p></div>
  <div class="card rounded-2xl shadow-lg p-6 bg-white"><h2>⚡ Satun rain</h2><strong>134</strong><p>Blazing fast millimetres.</p></div>
</section>
</body>
</html>
