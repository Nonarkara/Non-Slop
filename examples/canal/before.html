<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canal widget</title>
<style>
@font-face{font-family:Inter;src:url("../fonts/inter-400.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:Inter;src:url("../fonts/inter-700.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
*{box-sizing:border-box}
body{margin:0;background:#f8fafc;color:#0f172a;font-family:Inter,sans-serif;text-align:center}
.hero{padding:28px 16px 8px}
h1{margin:8px 0;font-size:36px}
.sub{margin:0 0 12px;color:#334155}
button{font:inherit;border-radius:12px;padding:12px 18px;margin:6px;min-height:44px}
.primary{background:#4f46e5;color:#ffffff;border:0}
.ghost{background:#ffffff;color:#0f172a;border:1px solid #cbd5e1}
.map-card{width:min(680px,calc(100% - 32px));height:38vh;min-height:280px;margin:12px auto;border-radius:16px;overflow:hidden;border:1px solid #cbd5e1;box-shadow:0 18px 40px rgba(15,23,42,.18);background:#d5e2dc}
#map{width:100%;height:100%}
#map svg{width:100%;height:100%;display:block}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:8px 20px 28px}
.card{background:#ffffff;border-radius:16px;box-shadow:0 12px 28px rgba(15,23,42,.12);padding:22px 12px;min-height:140px}
.card strong{display:block;font-size:32px;margin-top:6px}
h3{margin:0;font-size:16px;font-weight:600}
button:focus-visible,a:focus-visible{outline:2px solid #0f172a;outline-offset:3px}
@media (max-width:800px){.grid{grid-template-columns:1fr 1fr}}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<section class="hero text-center">
  <h1>Supercharge your map</h1>
  <p class="sub">Seamlessly unlock every station from one widget.</p>
  <button class="primary">Get Started</button>
  <button class="ghost">Learn More</button>
</section>
<div class="map-card"><div id="map">
  <svg viewBox="0 0 900 1100" role="img" aria-label="Small schematic of Khlong Bang Mot">
    <rect width="900" height="1100" fill="#d5e2dc"/>
    <path fill="#1f4b73" d="M520 0 L640 0 L680 240 L560 460 L650 720 L590 1100 L450 1100 L510 740 L430 470 L540 250 Z"/>
  </svg>
</div></div>
<section class="grid grid-cols-4">
  <div class="card rounded-2xl shadow-lg p-6 bg-white"><h3>🚀 BM-04</h3><strong>+42</strong></div>
  <div class="card rounded-2xl shadow-lg p-6 bg-white"><h3 lang="th">🔒 สะพานบางมด</h3><strong>+18</strong></div>
  <div class="card rounded-2xl shadow-lg p-6 bg-white"><h3 lang="th">⚡ ปากคลอง</h3><strong>−6</strong></div>
  <div class="card rounded-2xl shadow-lg p-6 bg-white"><h3 lang="th">✨ วัดใหม่</h3><strong>+3</strong></div>
</section>
</body>
</html>
