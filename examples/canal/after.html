<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bang Mot canal</title>
<style>
@font-face{font-family:"Jost";src:url("../fonts/jost-400.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Jost";src:url("../fonts/jost-600.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Prompt";src:url("../fonts/prompt-latin-400.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Prompt";src:url("../fonts/prompt-latin-600.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Prompt";src:url("../fonts/prompt-thai-400.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Prompt";src:url("../fonts/prompt-thai-600.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;background:#e7eeea;color:#1a2332}
body{font-family:"Jost","Prompt",sans-serif;font-size:18px;line-height:1.4}
header{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #1a2332;background:#e7eeea}
h1{margin:0;font-size:20px;font-weight:600;line-height:1}
header p{margin:0;font-size:14px}
main{height:calc(100vh - 48px);display:grid;grid-template-columns:1fr 250px;min-height:0}
#map{background:#d5e2dc;min-width:0;min-height:0}
#map svg{width:100%;height:100%;display:block}
aside{border-left:1px solid #1a2332;padding:16px 16px 20px;background:#e7eeea}
aside h2{margin:0 0 8px;font-size:16px;font-weight:600}
table{border-collapse:collapse;width:max-content;max-width:100%}
th,td{text-align:left;font-weight:400;font-size:16px;padding:8px 16px 8px 0;border-bottom:1px solid #b7c4bc}
.over{color:#9b1c3c;font-weight:600}
.note{margin:14px 0;font-size:15px;max-width:28ch}
.action{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border:1px solid #1a2332;color:#1a2332;text-decoration:none;font-weight:600;font-size:16px}
.action:hover{background:#1a2332;color:#e7eeea}
a:focus-visible{outline:2px solid #9b1c3c;outline-offset:3px}
@media (max-width:700px){
  main{height:auto;display:block}
  #map{height:70vh}
  aside{border-left:0;border-top:1px solid #1a2332}
}
</style>
</head>
<body>
<header>
  <h1 lang="th">คลองบางมด</h1>
  <p>Bang Mot</p>
</header>
<main>
  <div id="map">
    <svg viewBox="0 0 900 1100" role="img" aria-labelledby="canaltitle">
      <title id="canaltitle">Schematic of Khlong Bang Mot with four stations from the gauge fixture</title>
      <rect width="900" height="1100" fill="#d5e2dc"/>
      <path fill="#1f4b73" d="M520 0 L640 0 L680 240 L560 460 L650 720 L590 1100 L450 1100 L510 740 L430 470 L540 250 Z"/>
      <g fill="#1a2332" font-family="Jost, Prompt, sans-serif">
        <text x="36" y="108" font-size="26">BM-04</text>
        <text x="36" y="230" font-size="78" fill="#9b1c3c" font-weight="600">+42</text>
        <text x="36" y="292" font-size="22">cm, over the bank</text>
        <line x1="260" y1="160" x2="500" y2="180" stroke="#1a2332" stroke-width="1"/>
        <circle cx="540" cy="180" r="7" fill="#9b1c3c"/>

        <text x="36" y="430" font-size="32" font-family="Prompt, sans-serif" lang="th">สะพานบางมด</text>
        <text x="36" y="492" font-size="32">+18 cm</text>
        <line x1="300" y1="450" x2="470" y2="455" stroke="#1a2332" stroke-width="1"/>
        <circle cx="500" cy="455" r="6"/>

        <text x="36" y="680" font-size="32" font-family="Prompt, sans-serif" lang="th">ปากคลอง</text>
        <text x="36" y="742" font-size="32">−6 cm</text>
        <line x1="240" y1="700" x2="510" y2="710" stroke="#1a2332" stroke-width="1"/>
        <circle cx="545" cy="710" r="6"/>

        <text x="36" y="910" font-size="32" font-family="Prompt, sans-serif" lang="th">วัดใหม่</text>
        <text x="36" y="972" font-size="32">+3 cm</text>
        <line x1="220" y1="930" x2="500" y2="950" stroke="#1a2332" stroke-width="1"/>
        <circle cx="530" cy="950" r="6"/>
        <text x="36" y="1064" font-size="20">Schematic. Not to scale.</text>
      </g>
    </svg>
  </div>
  <aside>
    <h2>Stations</h2>
    <table>
      <caption class="note">Same centimetres as the gauge fixture in this repo. Not a live station.</caption>
      <thead><tr><th>Place</th><th>cm</th></tr></thead>
      <tbody>
        <tr><td>BM-04</td><td class="over">+42</td></tr>
        <tr><td lang="th">สะพานบางมด</td><td>+18</td></tr>
        <tr><td lang="th">ปากคลอง</td><td>−6</td></tr>
        <tr><td lang="th">วัดใหม่</td><td>+3</td></tr>
      </tbody>
    </table>
    <p><a class="action" href="../../test/fixtures/gauge/index.html">Open the gauge fixture</a></p>
  </aside>
</main>
</body>
</html>
