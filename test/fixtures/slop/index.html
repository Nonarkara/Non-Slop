<!doctype html>
<html>
<head>
<title>Acme AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; margin: 0; }
  .hero { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); text-align: center; padding: 120px 20px; }
  .hero h1 { background: linear-gradient(90deg,#fff,#c084fc); -webkit-background-clip: text; color: transparent; }
  nav { backdrop-filter: blur(12px); }
  button { outline: none; }
  .muted { color: #9ca3af; background: #ffffff; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px) } to { opacity: 1 } }
</style>
</head>
<body>
<nav class="fixed w-full backdrop-blur-md"><a href="/">Acme</a></nav>
<section class="hero text-center">
  <span class="rounded-full px-3 py-1">✨ Now with AI</span>
  <h1>Supercharge your workflow</h1>
  <p class="muted">Seamlessly unlock the power of your data with our cutting-edge, all-in-one platform.</p>
  <button class="rounded-xl bg-indigo-600">Get Started</button>
  <button class="rounded-xl">Learn More</button>
  <p>Trusted by 10,000+ teams</p>
</section>
<section class="grid md:grid-cols-3 gap-6">
  <div class="rounded-2xl shadow-lg p-6 bg-white"><h3>🚀 Fast</h3><p>Blazing fast.</p></div>
  <div class="rounded-2xl shadow-lg p-6 bg-white"><h3>🔒 Secure</h3><p>Enterprise grade.</p></div>
  <div class="rounded-2xl shadow-lg p-6 bg-white"><h3>⚡ Simple</h3><p>Effortless setup.</p></div>
</section>
<img src="https://i.pravatar.cc/80">
</body>
</html>
