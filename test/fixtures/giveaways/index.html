<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giveaways</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { font-family: Inter, sans-serif; margin: 0; }
  a:focus-visible, button:focus-visible { outline: 2px solid #0f6e56; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
  <p class="text-xs uppercase tracking-widest">Features</p>
  <h2>Stations on the canal</h2>
  <p class="text-sm text-gray-500">A grey line under the title.</p>

  <h1>Build <em>faster</em> with the gauge</h1>

  <h3>Time</h3>
  <p class="text-sm text-muted-foreground">Updated when the station reports.</p>

  <h3>Source</h3>
  <p class="text-xs text-slate-500 subtitle">The office that measured it.</p>

  <button class="uppercase tracking-wider" type="button">Export the sheet</button>

  <article class="border-l-2 border-emerald-800">The bank colour, said in a stripe.</article>
  <article class="border-l-2 border-emerald-800">The same stripe again.</article>

  <section class="flex">
    <div class="stat"><b>24</b><span>cities</span></div>
    <div class="stat"><b>3</b><span>rivers</span></div>
    <div class="stat"><b>99%</b><span>gauges</span></div>
  </section>

  <p><span class="animate-pulse inline-block h-2 w-2 rounded-full bg-emerald-500"></span> All Systems Operational</p>
</body>
</html>
