name: Decision geometry regression gate
on: [push, pull_request]
permissions: { contents: read }
jobs:
  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: node tools/decision-geometry/verify-source.mjs
      - run: node --test tools/decision-geometry/test.mjs tools/decision-geometry/cli-test.mjs tools/decision-geometry/path-test.mjs
  rendered-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/geometry-browser" --no-save --package-lock=false playwright@1.63.0
          "$RUNNER_TEMP/geometry-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Falsify real rendered faults
        run: DECISION_GEOMETRY_PLAYWRIGHT="$RUNNER_TEMP/geometry-browser/node_modules/playwright/index.mjs" node tools/decision-geometry/browser-test.mjs
